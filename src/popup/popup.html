<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focusaurus</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="../shared/doug.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="masthead">
    <span class="masthead__mark"><img src="../../assets/icons/mark.svg" width="24" height="24" alt="">Focusaurus</span>
    <span class="masthead__right">
      <span class="label" id="statusChip">—</span>
      <button type="button" class="iconbtn" id="settingsBtn"
              title="Settings" aria-label="Open settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m10 3-.7 2.2-2 .9-2.1-.5-2 3.4 1.5 1.7v2.6L3.2 15l2 3.4 2.1-.5 2 .9L10 21h4l.7-2.2 2-.9 2.1.5 2-3.4-1.5-1.7v-2.6L20.8 9l-2-3.4-2.1.5-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </span>
  </header>
  <main>
  <p class="app-error" id="appError" role="alert" hidden></p>

  <!-- Doug and his current read on the day. The mood IS the interface: you
       should be able to close the popup after this row and know where you
       stand. -->
  <section class="hero">
    <figure class="hero__portrait">
      <div class="hero__vignette" aria-hidden="true"></div>
      <div id="dougMount"></div>
    </figure>
    <div class="hero__text">
      <p class="label hero__eyebrow" id="dinoLabel">Your focus companion</p>
      <p class="hero__says display" id="moodLine">…</p>
      <p class="hero__because" id="moodBecause"></p>
    </div>
  </section>

  <!-- Session control -->
  <section class="panel">
    <h2 class="label">Session</h2>

    <div id="sessionIdle">
      <div class="chips" role="group" aria-label="Session length">
        <button type="button" class="chip chip--on" data-minutes="25" aria-pressed="true">25 min</button>
        <button type="button" class="chip" data-minutes="50" aria-pressed="false">50 min</button>
        <button type="button" class="chip" data-minutes="90" aria-pressed="false">90 min</button>
        <button type="button" class="chip" data-minutes="720" aria-pressed="false" aria-label="Open-ended session">Open</button>
      </div>
      <button type="button" class="btn btn--primary btn--block" id="startBtn">
        Start focusing
      </button>
      <p class="panel__note" id="setupHint">Choose a category or add a site below to begin.</p>
    </div>

    <div id="sessionActive" hidden>
      <p class="countdown" id="countdown">--:--</p>
      <p class="countdown__note" id="countdownNote"></p>
      <button type="button" class="btn btn--quiet btn--block" id="endBtn">
        End session
      </button>
    </div>
  </section>

  <!-- Today + the week's leader. The number is the glance; the line under
       it is the one the roadmap asked for — "this week you reached for
       Reddit 40 times" — compressed so the popup stays a control panel. -->
  <section class="panel">
    <div class="panel--row">
      <h2 class="label">Reached today</h2>
      <span class="stat" id="attemptsToday">0</span>
    </div>
    <p class="panel__note" id="attemptsWeek"></p>
  </section>

  <!-- Packs. Permanently available and independently toggleable — you can run
       any combination, and add or drop a whole category at once. -->
  <section class="panel">
    <h2 class="label">
      Categories <span class="label__count" id="packHint"></span>
    </h2>
    <div class="chips chips--packs" id="packChips"></div>
  </section>

  <!-- Blocklist -->
  <section class="panel">
    <h2 class="label">
      Blocking <span class="label__count" id="siteCount"></span>
    </h2>

    <form class="add" id="addForm">
      <input type="text" class="field" id="siteInput" placeholder="instagram.com"
             autocomplete="off" spellcheck="false" aria-label="Site to block">
      <button type="submit" class="btn btn--quiet">Add</button>
    </form>
    <p class="add__error" id="addError" role="status"></p>

    <p class="sites__empty" id="sitesEmpty">
      Nothing blocked yet — pick a category above, or type a site.
    </p>
    <!-- Scrolls independently: with several packs on this list runs long, and
         the popup's own controls must stay put. -->
    <div class="sites__scroll">
      <ul class="sites" id="siteList"></ul>
    </div>
  </section>
  </main>
  <footer class="popup-footer"><span>A little room to focus.</span><a href="../privacy/privacy.html" target="_blank">Local &amp; private</a></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
