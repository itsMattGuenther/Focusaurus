name: Release checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Exercise the packaged extension
        run: npm run test:browser
        env:
          FOCUSAURUS_EXTENSION_PATH: dist/extension
      - uses: actions/upload-artifact@v4
        with:
          name: focusaurus-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
            dist/package-manifest.json
            dist/privacy/
